# Manual Prow sweep for ResumePausedUser --burst-size across the 5 fake-dataplane
# control-plane tiers (2cpu, 1x8cpu_size10, 2x8cpu_size10, 4x8cpu_size10, 8x8cpu_size10).
tests:
  # ---- Tier 1: 1x2cpu (poolMaxConns: 64, size0, U=1000, smooth ceiling ~527 rps) ----
  - name: ateapi_cold_resume_pause_fake_2cpu_b100
    type: locust
    description: "ate-api-server cold resume burst sweep (B=100, U=1000, 1x2cpu): 100-600 cold resumes/s"
    targetCluster: dev
    file: /app/tests/resumepaused.py,/app/shapes/ladder_shape.py
    duration: 12m
    users: 1000
    workerCount: 200
    actorCPU: "5m"
    actorMemory: "5Mi"
    runnerCpu: "8"
    runnerMemory: "2Gi"
    isolate:
      delay: 150ms
    ateArgs:
      - "--cordon-system-infra-components"
    controlPlane:
      apiServer:
        replicas: 1
        cpu: 2
        memory: 4Gi
        poolMaxConns: 64
      postgres:
        args:
          - track_wal_io_timing=on
    flags:
      - "--ladder-spawn-rate"
      - "1000"
      - "--ladder"
      - "1000:2m@100,1000:2m@200,1000:2m@300,1000:2m@400,1000:2m@600"
      - "--target-rps"
      - "100"
      - "--burst-size"
      - "100"

