# Manual Prow sweep of --experimental-openfga-cache-ttl (PR #3009) on the
# 8x8cpu size10 fake-dataplane cold resume ladder (1s, 5s, 15s, 30s, 60s).
tests:
  - name: ateapi_cold_resume_pause_fake_8x8cpu_size10_cache_1s
    type: locust
    description: "ate-api-server cold resume on the fake data plane, 8x8 CPU, size10 Postgres, OpenFGA cache TTL 1s: rate ladder 5000-9000 cold resumes/s"
    targetCluster: dev
    file: /app/tests/resumepaused.py,/app/shapes/ladder_shape.py
    duration: 30m
    users: 14000
    workerCount: 200
    actorCPU: "5m"
    actorMemory: "5Mi"
    runnerCpu: "16"
    runnerMemory: "7Gi"
    isolate:
      delay: 150ms
    ateArgs:
      - "--cordon-system-infra-components"
      - "--cluster-size=size10"
    controlPlane:
      apiServer:
        replicas: 8
        cpu: 8
        memory: 4Gi
        poolMaxConns: 30
        openfgaCacheTTL: "1s"
      postgres:
        args:
          - track_wal_io_timing=on
    flags:
      - "--ladder-spawn-rate"
      - "14000"
      - "--ladder"
      - "14000:3m@5000,14000:3m@5500,14000:3m@6000,14000:3m@6500,14000:3m@7000,14000:3m@7500,14000:3m@8000,14000:3m@8500,14000:3m@9000"

