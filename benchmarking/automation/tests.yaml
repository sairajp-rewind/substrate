# Manual Prow run for hot-path authz benchmarks on the fake data plane:
# smoke check + all 5 Prow tests_control_plane_fake_dataplane.yaml profiles.
tests:
  - name: ateapi_authz_hotpath_fake_smoke
    type: locust
    description: "ate-api-server hot-path authz smoke on the fake data plane, ate-api-server at 2 CPUs: 50 actors, 20 then 50 cold resumes/s"
    targetCluster: dev
    file: /app/tests/resumepaused.py,/app/shapes/ladder_shape.py
    duration: 6m
    users: 50
    workerCount: 2
    actorCPU: "5m"
    actorMemory: "5Mi"
    isolate:
      delay: 150ms
    ateArgs:
      - "--cordon-system-infra-components"
      - "--ateapi-authz-bootstrap-owners=system:serviceaccount:ate-system:ate-client"
    controlPlane:
      apiServer:
        replicas: 1
        cpu: 2
        memory: 4Gi
        poolMaxConns: 64
      postgres:
        args:
          - track_wal_io_timing=on
    flags:
      - "--ladder-spawn-rate"
      - "50"
      - "--ladder"
      - "50:2m@20,50:2m@50"

